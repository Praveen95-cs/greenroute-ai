services:
  postgres:
    image: postgres:16-alpine
    container_name: greenroute-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-greenroute}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-greenroute_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-greenroute}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-greenroute} -d ${POSTGRES_DB:-greenroute}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
